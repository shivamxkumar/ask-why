<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="ASK//WHY — the unasked question engine. Find hidden assumptions, contradictions and missing evidence in project material." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..600&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // apply the saved theme before first paint (light by default)
      try { document.documentElement.dataset.theme = localStorage.getItem("askwhy:theme") === "dark" ? "dark" : "light"; }
      catch (e) { document.documentElement.dataset.theme = "light"; }
    </script>
    <title>ASK//WHY — The Unasked Question Engine</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
